# Keyboard Display Name
CONFIG_ZMK_KEYBOARD_NAME="Card 34"

# Split & Connectivity
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Disable PIN/Passkey Entry on Pairing
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# XIAO BLE Clock Stability
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Bluetooth Stability & Signal Tuning
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Power Management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_PM_SOFT_OFF=y

# Features
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y
# Automatically turn off the peripheral half when the central half enters soft off
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
